site_name: My Project Documentation
site_description: A comprehensive guide to my project.
site_author: Your Name

# This points to where your markdown files live
docs_dir: docs

theme:
  name: material
  # This forces the modern dark theme
  palette:
    scheme: slate
    primary: deep purple
    accent: cyan
  
  # Adds some nice modern UI features
  features:
    - navigation.tabs # Puts top-level sections in a top bar
    - navigation.indexes # Allows folders to have their own overview pages
    - search.suggest # Search bar autocomplete

# Enables syntax highlighting and beautiful code blocks
markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
